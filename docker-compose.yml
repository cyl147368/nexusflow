name: nexusflow

services:
  nexusflow:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      icloud-prime:
        condition: service_started
      mail-hub:
        condition: service_started
      payment-detector:
        condition: service_started
      updater:
        condition: service_started
    ports:
      - "${NEXUSFLOW_BIND:-0.0.0.0}:${NEXUSFLOW_PORT:-8770}:8765"
    environment:
      NEXUSFLOW_BASIC_USER: "${NEXUSFLOW_BASIC_USER:-admin}"
      NEXUSFLOW_BASIC_PASSWORD: "${NEXUSFLOW_BASIC_PASSWORD:?run scripts/deploy.sh or set in .env}"
      MAILHUB_INTERNAL_URL: "http://mail-hub:8090"
      ICLOUD_INTERNAL_URL: "http://icloud-prime:8081"
      MAILHUB_ADMIN_TOKEN: "${MAILHUB_ADMIN_TOKEN:?required}"
      ICLOUD_PRIME_API_TOKEN: "${ICLOUD_PRIME_API_TOKEN:?required}"
      PAYMENT_DETECTOR_URL: "http://payment-detector:8091"
      PAYMENT_DETECTOR_TOKEN: "${PAYMENT_DETECTOR_TOKEN:?required}"
      NEXUSFLOW_UPDATER_URL: "http://updater:8092"
      NEXUSFLOW_UPDATER_TOKEN: "${NEXUSFLOW_UPDATER_TOKEN:?required}"
      BROWSER_FALLBACK_ENABLED: "${BROWSER_FALLBACK_ENABLED:-1}"
      BROWSER_FALLBACK_DRIVER: "${BROWSER_FALLBACK_DRIVER:-auto}"
      BROWSER_FALLBACK_MAX_ATTEMPTS: "${BROWSER_FALLBACK_MAX_ATTEMPTS:-2}"
      BROWSER_FALLBACK_TIMEOUT: "${BROWSER_FALLBACK_TIMEOUT:-75}"
    shm_size: "1gb"
    volumes:
      - nexusflow-runtime:/app/runtime
    networks: [nexusflow]

  icloud-prime:
    build:
      context: ./services/icloud-prime
    restart: unless-stopped
    environment:
      ICLOUD_PRIME_API_TOKEN: "${ICLOUD_PRIME_API_TOKEN:?required}"
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - icloud-prime-data:/app/data
    expose: ["8081"]
    networks: [nexusflow]

  mail-hub:
    build:
      context: ./services/mail-hub
    restart: unless-stopped
    environment:
      MAILHUB_ADMIN_TOKEN: "${MAILHUB_ADMIN_TOKEN:?required}"
      MAILHUB_PUBLIC_URL: "${MAILHUB_PUBLIC_URL:?required}"
      MAILHUB_DB: "/app/data/mailhub.db"
      MAILHUB_SMTP_HOST: "0.0.0.0"
      MAILHUB_SMTP_PORT: "2525"
      TZ: "${TZ:-Asia/Shanghai}"
    ports:
      - "${MAILHUB_BIND:-0.0.0.0}:${MAILHUB_PORT:-8090}:8090"
      - "${MAILHUB_SMTP_BIND:-0.0.0.0}:${MAILHUB_SMTP_PUBLIC_PORT:-2525}:2525"
    volumes:
      - mail-hub-data:/app/data
    networks: [nexusflow]

  payment-detector:
    build:
      context: ./services/payment-detector
    restart: unless-stopped
    environment:
      PAYMENT_DETECTOR_TOKEN: "${PAYMENT_DETECTOR_TOKEN:?required}"
      NEXUSFLOW_DB_PATH: "/app/data/webui.db"
      PAYMENT_RESULTS_DB: "/app/results/payment-results.db"
      GPT_REGISTER_CONFIG_DIR: "/app/config"
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - nexusflow-runtime:/app/data:ro
      - payment-results:/app/results
    expose: ["8091"]
    networks: [nexusflow]

  updater:
    build:
      context: ./services/updater
    restart: unless-stopped
    environment:
      NEXUSFLOW_UPDATER_TOKEN: "${NEXUSFLOW_UPDATER_TOKEN:?required}"
      UPDATER_REPO_PATH: "/opt/nexusflow"
      UPDATER_BRANCH: "main"
    volumes:
      - "${NEXUSFLOW_REPO_PATH:-/opt/nexusflow}:/opt/nexusflow"
      - /var/run/docker.sock:/var/run/docker.sock
      - updater-state:/app/state
    expose: ["8092"]
    networks: [nexusflow]

networks:
  nexusflow:

volumes:
  nexusflow-runtime:
  icloud-prime-data:
  mail-hub-data:
  payment-results:
  updater-state:
